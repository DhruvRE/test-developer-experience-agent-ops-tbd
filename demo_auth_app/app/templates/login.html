<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Demo Auth App</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>Welcome Back</h1>
            <p>Enter your credentials to access your account</p>
        </div>

        <div id="error-alert" class="alert alert-error" data-testid="error-alert"></div>
        <div id="success-alert" class="alert alert-success" data-testid="success-alert"></div>

        <form id="login-form" data-testid="login-form">
            <div class="form-group">
                <label for="username">Username or Email</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    data-testid="username-input" 
                    placeholder="Enter your username or email" 
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    data-testid="password-input" 
                    placeholder="Enter your password" 
                    required
                >
            </div>

            <button type="submit" id="login-btn" class="btn" data-testid="login-btn">Sign In</button>
        </form>

        <div class="auth-footer">
            Don't have an account? <a href="/register" id="register-link" data-testid="register-link">Register here</a>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
</body>
</html>
