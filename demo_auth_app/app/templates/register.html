<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Demo Auth App</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1>Create Account</h1>
            <p>Register a new account to test authentication</p>
        </div>

        <div id="error-alert" class="alert alert-error" data-testid="error-alert"></div>
        <div id="success-alert" class="alert alert-success" data-testid="success-alert"></div>

        <form id="register-form" data-testid="register-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    data-testid="username-input" 
                    placeholder="Enter unique username" 
                    required 
                    minlength="3"
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    data-testid="email-input" 
                    placeholder="you@example.com" 
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    data-testid="password-input" 
                    placeholder="At least 8 chars, 1 uppercase, 1 digit" 
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input 
                    type="password" 
                    id="confirm_password" 
                    name="confirm_password" 
                    data-testid="confirm-password-input" 
                    placeholder="Re-enter your password" 
                    required
                >
            </div>

            <button type="submit" id="register-btn" class="btn" data-testid="register-btn">Create Account</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="/login" id="login-link" data-testid="login-link">Sign In</a>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
</body>
</html>
