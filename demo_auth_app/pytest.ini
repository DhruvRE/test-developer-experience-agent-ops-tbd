[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v
markers =
    unit: marks tests as isolated unit tests (deselect with '-m "not unit"')
    api: marks tests as API / endpoint tests (deselect with '-m "not api"')
    ui: marks tests as browser UI tests (deselect with '-m "not ui"')

